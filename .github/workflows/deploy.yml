name: Deploy Static Web

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Kéo code về
      uses: actions/checkout@v3

    - name: Deploy lên VPS
      uses: easingthemes/ssh-deploy@main
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        REMOTE_HOST: ${{ secrets.SERVER_HOST }}
        REMOTE_USER: ${{ secrets.SERVER_USER }}
        SOURCE: "site/"
        TARGET: "/home/deploy/projects/enails_spa/html/"
        ARGS: "-rlzvc --delete"
        SCRIPT_BEFORE: |
          mkdir -p /home/deploy/projects/enails_spa/html
          if [ ! -w /home/deploy/projects/enails_spa/html ]; then
            echo "ERROR: deploy user has no write permission on /home/deploy/projects/enails_spa/html"
            echo "Run once on VPS as root: chown -R deploy:deploy /home/deploy/projects/enails_spa/html && chmod -R u+rwX /home/deploy/projects/enails_spa/html"
            exit 1
          fi
          echo "Bắt đầu deploy..."
        SCRIPT_AFTER: |
          echo "Deploy thành công!"