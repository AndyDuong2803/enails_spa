name: Deploy Static Web

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Kéo code về
      uses: actions/checkout@v3

    - name: Deploy lên VPS
      uses: easingthemes/ssh-deploy@main
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        REMOTE_HOST: ${{ secrets.SERVER_HOST }}
        REMOTE_USER: ${{ secrets.SERVER_USER }}
        SOURCE: "site/"
        TARGET: "/home/deploy/projects/enails_spa/html/"
        ARGS: "-rlzvc --delete"
        SCRIPT_BEFORE: |
          mkdir -p /home/deploy/projects/enails_spa/html
          if command -v sudo >/dev/null 2>&1; then
            sudo chown -R deploy:deploy /home/deploy/projects/enails_spa/html || true
          fi
          chmod -R u+rwX /home/deploy/projects/enails_spa/html || true
          echo "Bắt đầu deploy..."
        SCRIPT_AFTER: |
          echo "Deploy thành công!"